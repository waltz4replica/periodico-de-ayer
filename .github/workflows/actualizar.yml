name: Actualizar noticias

on:
  schedule:
    # Horas en UTC. En Madrid: ~7:00, ~14:00 y ~21:00 (una hora más en verano).
    - cron: "7 6 * * *"
    - cron: "7 13 * * *"
    - cron: "7 20 * * *"
  workflow_dispatch: # botón «Run workflow» para actualizar a mano
  push:
    branches: [main]
    paths:
      - "app/**"
      - "!app/data/**"
      - "scripts/**"
      - "feeds.json"
      - ".github/workflows/actualizar.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar noticias
        run: python scripts/fetch_news.py

      - name: Guardar la edición en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Edición del $(TZ=Europe/Madrid date +%F\ %H:%M)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deploy
        uses: actions/deploy-pages@v4
