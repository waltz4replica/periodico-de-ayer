name: Actualizar noticias

on:
  schedule:
    # Horas en UTC. En Madrid: ~7:00, ~14:00 y ~21:00 (una hora más en verano).
    - cron: "7 6 * * *"
    - cron: "7 13 * * *"
    - cron: "7 20 * * *"
  workflow_dispatch: # botón «Run workflow» para actualizar a mano
  push:
    branches: [main]
    paths:
      - "app/**"
      - "!app/data/**"
      - "scripts/**"
      - "feeds.json"
      - ".github/workflows/actualizar.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar noticias y guardar la edición
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Si otra ejecución guardó noticias mientras tanto, se regenera sobre la versión
          # más reciente (el script mezcla con lo ya guardado, así que no se pierde nada).
          for intento in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            python scripts/fetch_news.py
            git add app/data
            if git diff --cached --quiet; then echo "Sin cambios"; break; fi
            git commit -q -m "Edición del $(TZ=Europe/Madrid date +%F\ %H:%M)"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
            echo "Otra ejecución guardó antes; reintento ($intento)…"
            sleep 5
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      # GitHub Pages a veces falla de forma temporal: se reintenta una vez
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Esperar antes de reintentar la publicación
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
