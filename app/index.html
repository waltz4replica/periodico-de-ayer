<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Periódico</title>
  <meta name="description" content="Las noticias del día de los principales periódicos, en un solo sitio.">
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Periódico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <!-- Barra superior -->
  <header class="appbar" id="appbar">
    <button class="icon-btn" id="btn-menu" aria-label="Abrir menú" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <h1 class="appbar-title"><a href="#/" id="appbar-title">Mi Periódico</a></h1>
    <button class="icon-btn" id="btn-search" aria-label="Buscar" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
    </button>
    <form class="search" id="search" role="search" hidden>
      <input type="search" id="search-input" placeholder="Buscar en todas las secciones…" autocomplete="off" enterkeyhint="search" aria-label="Buscar noticias">
      <button type="button" class="icon-btn small" id="search-close" aria-label="Cerrar búsqueda">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </form>
  </header>

  <div class="install" id="install" hidden>
    <p id="install-text">Instala Mi Periódico en tu móvil para abrirlo como una app.</p>
    <button class="btn" id="install-btn" hidden>Instalar</button>
    <button class="icon-btn small" id="install-close" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <!-- Contenido de la página actual -->
  <main id="page" aria-live="polite"></main>
  <div id="sentinel"></div>

  <!-- Barra inferior -->
  <nav class="tabbar" id="tabbar" aria-label="Secciones principales"></nav>

  <!-- Menú lateral -->
  <dialog class="drawer" id="drawer" aria-label="Menú">
    <div class="drawer-head">
      <div>
        <p class="drawer-title">Mi Periódico</p>
        <p class="drawer-date" id="drawer-date"></p>
      </div>
      <button class="icon-btn small" data-close aria-label="Cerrar menú">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <nav class="drawer-body" id="drawer-body"></nav>
  </dialog>

  <!-- Hoja inferior reutilizable (filtros, hemeroteca) -->
  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="icon-btn small" data-close aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
    <div class="sheet-foot" id="sheet-foot"></div>
  </dialog>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button class="btn" id="toast-action" hidden></button>
  </div>

  <script src="app.js?v=6" defer></script>
</body>
</html>
